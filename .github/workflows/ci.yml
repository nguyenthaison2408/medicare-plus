name: MediCare Plus CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, feat/cloud-checkin-reception, feat/cloud-emr-prescription, feat/supabase-family-profiles ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify Office Submission Package
        run: node scripts/export-word-reports.cjs artifacts/report-export-check

      - name: Verify PostgreSQL Migration and RLS
        run: npm run test:db

      - name: Verify Clinical Lab Files
        run: npm run test:lab

      - name: Verify AI Conversation and Routing
        run: npm run test:ai

      - name: Verify Portal Session and Administration
        run: npm run test:portal

      - name: Verify Staff Workflow Results
        run: npm run test:staff

      - name: Verify Authentication Failure Handling
        run: npm run test:auth

      - name: Verify Patient Information Validation
        run: npm run test:booking-validation

      - name: Install Server Dependencies & Test
        run: |
          cd server
          npm ci
          npm test

      - name: Install Client Dependencies and Build Web
        env:
          EXPO_PUBLIC_DATA_MODE: supabase
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd client
          node -e "for (const name of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY']) { if (!process.env[name]) throw new Error('Missing repository variable: ' + name); }"
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Preserve Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicare-web-node-${{ matrix.node-version }}
          path: client/dist
          if-no-files-found: error

      - name: Automated Security Audit
        run: npm --prefix client audit --audit-level=high
